name: PR

on:
  pull_request:
    branches:
      - main

env:
  LVCE_WS_TRACE_DIR: ${{ github.workspace }}/packages/e2e/e2e-artifacts

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.ts)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: node packages/build/src/traceWebSocketStartup.ts
      - run: npm run build
      - run: npm run build:static
      - run: npm test
      - run: npm run type-check
      - run: npm run lint
      - name: install playwright system dependencies
        working-directory: ./packages/e2e
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps chromium firefox webkit
      - name: install playwright dependencies
        working-directory: ./packages/e2e
        run: npx playwright install chromium firefox
        if: steps.npm-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: install playwright webkit dependency
        working-directory: ./packages/e2e
        run: npx playwright install webkit
        if: runner.os != 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e
        working-directory: ./packages/e2e
        run: npm run e2e:headless
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e firefox
        working-directory: ./packages/e2e
        run: npm run e2e:firefox:headless -- --timeout=2100000
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: e2e webkit
        working-directory: ./packages/e2e
        run: npm run e2e:webkit:headless -- --timeout=2100000
        if: runner.os != 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: measure
        run: npm run measure
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0

  socket-transfer:
    name: Windows socket transfer attempt ${{ matrix.attempt }}
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Probe socket transfer before and after pausing
        shell: bash
        run: |
          set -o pipefail
          node packages/build/src/probeSocketTransfer.ts 2>&1 | tee socket-transfer.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: socket-transfer-${{ matrix.attempt }}
          path: socket-transfer.log
